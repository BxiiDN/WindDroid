name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm bison
      - name: Build ACPICA acpiexec (ACPI table validation)
        run: |
          git clone -q https://github.com/acpica/acpica /tmp/acpica
          git -C /tmp/acpica checkout -q e85aa3bebaae81ed1e6d163511ac7e1eafe732cf
          make -C /tmp/acpica acpiexec -j4 > /dev/null
          echo "ACPIEXEC=/tmp/acpica/generate/unix/bin/acpiexec" >> "$GITHUB_ENV"
      - name: Build engine and guest programs, run all tests
        run: make test
      - name: Interpreter only (the translator is on by default on ARM64)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: python3 tests/run_tests.py --interp --no-firmware
      - name: Upload guest programs
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: guests
          path: guest/build/*.elf

  mutation:
    name: Mutation testing (injected bugs must be detected)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm
      - name: Build
        run: make -j4 all build/unit_tests && make -C guest -j4
      - name: Run mutants
        run: python3 tests/mutation_test.py

  mutation-jit:
    name: Mutation testing of the block translator (ARM64)
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm
      - name: Build
        run: make -j4 all build/unit_tests && make -C guest -j4
      - name: Run mutants
        run: MUTATION_JIT=1 python3 tests/mutation_test.py

  apk:
    name: Android APK
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install guest toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm
      - name: Build bundled demo guest
        run: |
          make -C guest build/monitor.elf
          llvm-objcopy --strip-debug guest/build/monitor.elf apk/app/src/main/assets/monitor.elf
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then V="$(cat VERSION)"
          else V="$(cat VERSION)-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        working-directory: apk
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PwdVersionName=${{ steps.ver.outputs.name }} -PwdVersionCode=${{ github.run_number }}
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/WindDroid-${{ steps.ver.outputs.name }}.apk
      - name: Check APK contents
        run: |
          unzip -l dist/*.apk | tee /tmp/apk.txt
          grep -q "lib/arm64-v8a/libwinddroid.so" /tmp/apk.txt
          grep -q "lib/x86_64/libwinddroid.so" /tmp/apk.txt
          grep -q "assets/monitor.elf" /tmp/apk.txt
          grep -q "assets/QEMU_EFI.fd" /tmp/apk.txt
          grep -q "assets/QEMU_VARS.fd" /tmp/apk.txt
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WindDroid-apk
          path: dist/*.apk

  android-smoke:
    name: APK on Android emulator
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WindDroid-apk
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install APK, run the monitor through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-logs
          path: |
            guest.log
            crash.log
            uefi.log
            crash2.log

  release:
    # A release is published for every new version: either a pushed v* tag, or a
    # push to main whose VERSION file names a version that has no release yet.
    name: GitHub Release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [apk, android-smoke, mutation, mutation-jit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WindDroid-apk
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v$(cat VERSION)"; fi
          NOTES=apk/RELEASE_NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release upload "$TAG" dist/*.apk --clobber
            else
              echo "Release $TAG already exists; bump VERSION to publish a new one."
            fi
          else
            gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --title "WindDroid ${TAG}" --notes-file "$NOTES"
          fi
