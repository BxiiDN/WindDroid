name: jit

# Block translator development: everything on a native ARM64 runner with -J.
on:
  push:
    branches: [jit]
  workflow_dispatch:

jobs:
  jit:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm
      - name: Build
        run: make -j4 all build/unit_tests && make -C guest -j4
      - name: Divergence report (interpreter vs translator, one-instruction blocks)
        if: always()
        run: |
          python3 tests/jit_diff.py build/winddroid-vm guest/build/t_irq.elf -i 'hey!' || true
          python3 tests/jit_diff.py build/winddroid-vm guest/build/t_sys.elf || true
          echo "== full-size blocks"
          WD_JIT_FULL=1 python3 tests/jit_diff.py build/winddroid-vm guest/build/t_irq.elf -i 'hey!' || true
      - name: Guest tests with the translator
        run: python3 tests/run_tests.py --jit --no-firmware
      - name: Firmware, disk and USB tests with the translator
        run: python3 tests/run_tests.py --jit --timeout 600
      - name: Translator mutants
        run: MUTATION_JIT=1 python3 tests/mutation_test.py
      - name: Speed
        if: always()
        run: |
          for f in t_cprog_O2 monitor; do
            echo "== $f"; build/winddroid-vm -i 'bench\npoweroff\n' guest/build/$f.elf | tail -3
            echo "== $f -J"; build/winddroid-vm -J -i 'bench\npoweroff\n' guest/build/$f.elf | tail -3
          done
