plugins {
    id "com.android.application"
}

def versionNameProp = project.findProperty("wdVersionName") ?: "0.3.0"
def versionCodeProp = (project.findProperty("wdVersionCode") ?: "1").toInteger()

android {
    namespace "com.bxiidn.winddroid"
    compileSdk 35

    defaultConfig {
        applicationId "com.bxiidn.winddroid"
        minSdk 26
        targetSdk 35
        versionCode versionCodeProp
        versionName versionNameProp
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            // Public, non-secret key so that every build can upgrade the previous one.
            storeFile file("../keystore/winddroid-release.jks")
            storePassword "winddroid"
            keyAlias "winddroid"
            keyPassword "winddroid"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            // UEFI firmware (EDK2 ArmVirtQemu) shipped as assets
            assets.srcDirs += ["../../firmware"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
